name: Build Raineoy Gomoku LAN APK
on:
  push:
    branches:
      - gomoku-lan-apk-20261029
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools and SDK
        shell: bash
        run: |
          set -e
          echo "SDK location: $ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fSL --retry 3 "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/android-cmdline.zip
          mkdir -p /tmp/raineoy-android-tools
          unzip -q /tmp/android-cmdline.zip -d /tmp/raineoy-android-tools
          mv /tmp/raineoy-android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack game source
        shell: bash
        run: |
          base64 -d gomoku/raineoy_source.tar.xz.b64 | tar -xJ
          test -f app/src/main/java/com/raineoy/gomoku/MainActivity.java
      - name: Assemble installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RaineoyGomoku-LAN-v1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

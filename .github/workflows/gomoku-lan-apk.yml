name: Build Raineoy Gomoku LAN APK
on:
  push:
    branches:
      - gomoku-lan-apk-20261029
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          ls -la "$ANDROID_HOME/platforms" || true
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack game source
        shell: bash
        run: |
          base64 -d gomoku/raineoy_source.tar.xz.b64 | tar -xJ
          test -f app/src/main/java/com/raineoy/gomoku/MainActivity.java
      - name: Assemble installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RaineoyGomoku-LAN-v1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
